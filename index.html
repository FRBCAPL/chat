<!DOCTYPE html>
<html>
<head>
  <title>Sendbird Chat v3 Demo</title>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sendbird/3.1.13/SendBird.min.js"></script>
  <style>
    body {
      background: #000;
      color: #ccc;
      font-family: Arial, sans-serif;
    }
    #messages {
      border: 1px solid #333;
      background: #181818;
      height: 300px;
      overflow: auto;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    #messages p {
      margin: 0 0 8px 0;
      padding: 6px 10px;
      border-radius: 6px;
      max-width: 80%;
      word-break: break-word;
    }
    #messages p.me {
      background: #D32F2F;
      color: #fff;
      text-align: right;
      margin-left: 20%;
    }
    #messages p.other {
      background: #222;
      color: #ccc;
      text-align: left;
      margin-right: 20%;
    }
    #messageInput {
      width: 70%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
    }
    #sendBtn {
      padding: 8px 15px;
      background: #D32F2F;
      color: white;
      border: none;
      border-radius: 4px;
      margin-left: 8px;
      cursor: pointer;
    }
    #sendBtn:hover {
      background: #B71C1C;
    }
  </style>
</head>
<body>
  <h1>Sendbird Chat v3</h1>
  <div id="messages"></div>
  <input type="text" id="messageInput" placeholder="Type a message" />
  <button id="sendBtn">Send</button>
  <script>
    const APP_ID = 'AA3FE8A5-3D6A-4058-9C00-58C2508098DE';
    const USER_ID = 'user_' + Math.floor(Math.random() * 10000);
    const TEST_USER = 'test_user_123';

    const sb = new SendBird({ appId: APP_ID });

    sb.connect(USER_ID, function(user, error) {
      if (error) {
        alert('Connection failed: ' + error.message);
        console.error(error);
        return;
      }
      sb.GroupChannel.createChannelWithUserIds([USER_ID, TEST_USER], true, 'Test Channel', '', '', function(channel, error) {
        if (error) {
          alert('Channel creation failed: ' + error.message);
          console.error(error);
          return;
        }
        const messagesDiv = document.getElementById('messages');
        // Load previous messages
        const messageListQuery = channel.createPreviousMessageListQuery();
        messageListQuery.load(20, true, function(messages, error) {
          if (!error) {
            messages.forEach(msg => {
              const p = document.createElement('p');
              p.textContent = `${msg.sender.userId}: ${msg.message}`;
              p.className = (msg.sender.userId === USER_ID) ? 'me' : 'other';
              messagesDiv.appendChild(p);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
          }
        });
        // Real-time incoming messages
        const ChannelHandler = new sb.ChannelHandler();
        ChannelHandler.onMessageReceived = function(channel, message) {
          const p = document.createElement('p');
          p.textContent = `${message.sender.userId}: ${message.message}`;
          p.className = (message.sender.userId === USER_ID) ? 'me' : 'other';
          messagesDiv.appendChild(p);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        };
        sb.addChannelHandler('UNIQUE_HANDLER_ID', ChannelHandler);
        // Send messages
        document.getElementById('sendBtn').onclick = function() {
          const input = document.getElementById('messageInput');
          const msg = input.value.trim();
          if (!msg) return;
          channel.sendUserMessage(msg, function(message, error) {
            if (error) {
              alert('Send failed: ' + error.message);
              console.error(error);
            } else {
              const p = document.createElement('p');
              p.textContent = `${message.sender.userId}: ${message.message}`;
              p.className = 'me';
              messagesDiv.appendChild(p);
              messagesDiv.scrollTop = messagesDiv.scrollHeight;
              input.value = '';
            }
          });
        };
        // Optional: Send on Enter key
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
          if (e.key === 'Enter') document.getElementById('sendBtn').click();
        });
      });
    });
  </script>
</body>
</html>
