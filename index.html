<!DOCTYPE html>
<html>
<head>
  <title>Player Chat Portal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sendbird/3.1.13/SendBird.min.js"></script>
  <style>
    /* Keep your existing black/red styling from previous versions */
    body { background: #000; color: #ccc; font-family: Arial, sans-serif; }
    #messages { border: 1px solid #333; height: 300px; overflow: auto; padding: 10px; margin-bottom: 10px; background: #181818; }
    #messageInput { width: 80%; padding: 8px; background: #222; color: #fff; border: 1px solid #333; }
    #sendBtn { padding: 8px 15px; background: #D32F2F; color: white; border: none; cursor: pointer; }
    #pinSection { max-width: 300px; margin: 50px auto; text-align: center; }
  </style>
</head>
<body>
  <div id="pinSection">
    <h2>Player Chat Portal</h2>
    <input type="password" id="pinInput" placeholder="Enter your PIN" />
    <button onclick="verifyPin()">Submit</button>
    <div id="pinMessage" style="color:red; margin-top:10px;"></div>
  </div>
  
  <div id="chatSection" style="display:none;">
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Type a message" />
    <button id="sendBtn">Send</button>
  </div>

<script>
const APP_ID = 'AA3FE8A5-3D6A-4058-9C00-58C2508098DE';
const sheetID = "1tvMgMHsRwQxsR6lMNlSnztmwpK7fhZeNEyqjTqmRFRc";
const pinSheetName = "BCAPL SIGNUP";
const TEST_USER = "system_bot_1"; // Required second user for channels

let sb, channel;

async function verifyPin() {
  const pin = document.getElementById("pinInput").value.trim();
  if (!pin) return showPinError("Please enter a PIN");
  
  try {
    const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(pinSheetName)}`;
    const response = await fetch(url);
    const data = await response.text();
    const json = JSON.parse(data.substr(47).slice(0, -2));
    
    const userRow = json.table.rows.find(row => 
      row.c[11]?.v?.toString() === pin
    );
    
    if (!userRow) return showPinError("Invalid PIN");
    
    initChat({
      userId: pin + "_" + userRow.c[0].v.replace(/\s+/g, "_"),
      nickname: toProperCase(userRow.c[0].v)
    });
    
  } catch (error) {
    showPinError("Error verifying PIN");
    console.error(error);
  }
}

function initChat({userId, nickname}) {
  sb = new SendBird({ appId: APP_ID });
  
  sb.connect(userId, (user, error) => {
    if (error) return handleError("Connection failed", error);
    
    sb.updateCurrentUserInfo(nickname, null);
    document.getElementById("pinSection").style.display = "none";
    document.getElementById("chatSection").style.display = "block";
    
    createOrJoinChannel(userId);
  });
}

function createOrJoinChannel(userId) {
  const channelHandler = new sb.ChannelHandler();
  
  // 1. Try to find existing channel
  const query = sb.GroupChannel.createMyGroupChannelListQuery();
  query.userIdsIncludeFilter = [userId, TEST_USER];
  
  query.next((channels, error) => {
    if (channels.length > 0) {
      channel = channels[0];
      setupChannel();
    } else {
      // 2. Create new channel if none exists
      sb.GroupChannel.createChannel({
        name: "General Chat",
        isDistinct: true,
        userIds: [userId, TEST_USER],
        operatorUserIds: [userId]
      }, (newChannel, error) => {
        if (error) return handleError("Channel creation failed", error);
        channel = newChannel;
        setupChannel();
      });
    }
  });
  
  // Handle incoming messages
  channelHandler.onMessageReceived = (targetChannel, message) => {
    if (channel.url === targetChannel.url) {
      appendMessage(message);
    }
  };
  sb.addChannelHandler('main_handler', channelHandler);
}

function setupChannel() {
  // Load message history
  const query = channel.createPreviousMessageListQuery();
  query.load(100, true, (messages, error) => {
    if (!error) messages.forEach(appendMessage);
  });

  // Send message handler
  document.getElementById("sendBtn").onclick = () => {
    const message = document.getElementById("messageInput").value.trim();
    if (!message) return;
    
    channel.sendUserMessage(message, (sentMessage, error) => {
      if (error) return handleError("Send failed", error);
      document.getElementById("messageInput").value = "";
    });
  };
}

// Helper functions
function appendMessage(msg) {
  const div = document.createElement("div");
  div.textContent = `${msg.sender.nickname}: ${msg.message}`;
  div.style.color = msg.sender.userId === sb.currentUser.userId ? "#D32F2F" : "#ccc";
  document.getElementById("messages").appendChild(div);
}

function toProperCase(str) {
  return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function showPinError(message) {
  document.getElementById("pinMessage").textContent = message;
}

function handleError(context, error) {
  console.error(context, error);
  alert(`${context}: ${error.message}`);
}
</script>
</body>
</html>
