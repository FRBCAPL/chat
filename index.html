<!DOCTYPE html>
<html>
<head>
  <title>Sendbird Multi-Channel Chat with PIN</title>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sendbird/3.1.13/SendBird.min.js"></script>
  <style>
    body {
      background: #000;
      color: #ccc;
      font-family: Arial, sans-serif;
    }
    #container {
      display: flex;
      max-width: 900px;
      margin: 30px auto;
      border-radius: 10px;
      background: #181818;
      box-shadow: 0 0 20px #111;
      overflow: hidden;
    }
    #sidebar {
      width: 240px;
      background: #121212;
      border-right: 1px solid #333;
      padding: 20px 10px 10px 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      min-height: 400px;
    }
    #sidebar h2 {
      color: #D32F2F;
      font-size: 1.2em;
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
    }
    #channelsList {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .channel-item {
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 5px;
      cursor: pointer;
      background: #222;
      color: #ccc;
      border: 1px solid #222;
      transition: background 0.2s, border 0.2s;
    }
    .channel-item.active, .channel-item:hover {
      background: #D32F2F;
      color: #fff;
      border: 1px solid #B71C1C;
    }
    #createChannelForm, #privateChatForm {
      margin-bottom: 12px;
      text-align: center;
    }
    #createChannelInput, #privateUserInput {
      width: 80%;
      padding: 7px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      margin-bottom: 5px;
    }
    #createChannelBtn, #privateChatBtn {
      padding: 7px 13px;
      background: #D32F2F;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 3px;
      margin-bottom: 5px;
    }
    #createChannelBtn:hover, #privateChatBtn:hover {
      background: #B71C1C;
    }
    #chatArea {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      min-width: 0;
      min-height: 400px;
    }
    #currentChannelName {
      color: #D32F2F;
      font-size: 1.2em;
      margin: 0 0 10px 0;
      text-align: center;
    }
    #messages {
      border: 1px solid #333;
      background: #181818;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      flex: 1;
      min-height: 0;
    }
    #messages p {
      margin: 0 0 8px 0;
      padding: 6px 10px;
      border-radius: 6px;
      max-width: 80%;
      word-break: break-word;
    }
    #messages p.me {
      background: #D32F2F;
      color: #fff;
      text-align: right;
      margin-left: 20%;
    }
    #messages p.other {
      background: #222;
      color: #ccc;
      text-align: left;
      margin-right: 20%;
    }
    #inputRow {
      display: flex;
      align-items: center;
      margin-top: 5px;
    }
    #messageInput {
      flex: 1;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      margin-right: 8px;
    }
    #sendBtn {
      padding: 8px 15px;
      background: #D32F2F;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #sendBtn:hover {
      background: #B71C1C;
    }
    #userIdDisplay {
      font-size: 0.95em;
      margin-bottom: 10px;
      color: #888;
      text-align: center;
    }
    #pinSection {
      max-width: 350px;
      margin: 100px auto;
      background: #181818;
      padding: 30px 30px 20px 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px #111;
      text-align: center;
    }
    #pinInput, #pinSection button {
      max-width: 200px;
      margin: 0 auto 10px auto;
      display: block;
      width: 100%;
      font-size: 1em;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div id="pinSection">
    <h2>Player Chat Portal</h2>
    <input type="password" id="pinInput" placeholder="Enter your PIN" />
    <button onclick="verifyPin()">Submit</button>
    <div id="pinMessage" style="color:red; margin-top:10px;"></div>
  </div>
  <div id="container" style="display:none;">
    <div id="sidebar">
      <div id="userIdDisplay"></div>
      <h2>Channels</h2>
      <div id="channelsList"></div>
      <form id="createChannelForm" autocomplete="off">
        <input type="text" id="createChannelInput" placeholder="New channel name" required />
        <button type="submit" id="createChannelBtn">Create</button>
      </form>
      <form id="privateChatForm" autocomplete="off">
        <input type="text" id="privateUserInput" placeholder="User ID for private chat" required />
        <button type="submit" id="privateChatBtn">Private Chat</button>
      </form>
    </div>
    <div id="chatArea">
      <div id="currentChannelName">Loading...</div>
      <div id="messages"></div>
      <div id="inputRow">
        <input type="text" id="messageInput" placeholder="Type a message" autocomplete="off" />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>
  <script>
    // === PIN VERIFICATION CONFIG ===
    const sheetID = "1tvMgMHsRwQxsR6lMNlSnztmwpK7fhZeNEyqjTqmRFRc";
    const pinSheetName = "BCAPL SIGNUP"; // Adjust if needed

    // === SENDIRD CONFIG ===
    const APP_ID = 'AA3FE8A5-3D6A-4058-9C00-58C2508098DE';
    let USER_ID = '';
    let USER_NAME = '';

    // PIN Verification
    async function verifyPin() {
      const pin = document.getElementById("pinInput").value.trim();
      if (!pin) {
        document.getElementById("pinMessage").innerText = "Please enter a PIN.";
        return;
      }
      document.getElementById("pinMessage").innerText = "Checking PIN...";
      try {
        const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(pinSheetName)}`;
        const response = await fetch(url);
        const text = await response.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows;
        let found = false;
        for (let row of rows) {
          const pinCol = row.c[11];
          if (pinCol && pinCol.v && pinCol.v.toString() === pin) {
            USER_NAME = row.c[0]?.v?.toString().trim() || "Unknown";
            USER_ID = USER_NAME.replace(/\s+/g, "_").toLowerCase();
            found = true;
            break;
          }
        }
        if (found) {
          document.getElementById("pinSection").style.display = "none";
          document.getElementById("container").style.display = "flex";
          startChat();
        } else {
          document.getElementById("pinMessage").innerText = "Invalid PIN.";
        }
      } catch (error) {
        console.error("PIN Error:", error);
        document.getElementById("pinMessage").innerText = "Error verifying PIN.";
      }
    }

    // === CHAT LOGIC ===
    let sb, currentChannel = null, channelHandler = null;

    function renderMessage(msg) {
      const p = document.createElement('p');
      p.textContent = `${msg.sender ? msg.sender.userId : 'System'}: ${msg.message}`;
      p.className = (msg.sender && msg.sender.userId === USER_ID) ? 'me' : 'other';
      document.getElementById('messages').appendChild(p);
    }

    function clearMessages() {
      document.getElementById('messages').innerHTML = '';
    }

    function loadMessages(channel) {
      clearMessages();
      document.getElementById('currentChannelName').textContent = channel.name || '(No Name)';
      const messageListQuery = channel.createPreviousMessageListQuery();
      messageListQuery.load(30, true, function(messages, error) {
        if (!error) {
          messages.forEach(renderMessage);
          const messagesDiv = document.getElementById('messages');
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
      });
    }

    function setupChannelHandler(channel) {
      // Remove old handler
      if (channelHandler) sb.removeChannelHandler('handler');
      channelHandler = new sb.ChannelHandler();
      channelHandler.onMessageReceived = function(ch, message) {
        if (currentChannel && ch.url === currentChannel.url) {
          renderMessage(message);
          const messagesDiv = document.getElementById('messages');
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
      };
      sb.addChannelHandler('handler', channelHandler);
    }

    function switchChannel(channel) {
      currentChannel = channel;
      loadMessages(channel);
      setupChannelHandler(channel);
    }

    function renderChannelsList(channels, activeUrl) {
      const listDiv = document.getElementById('channelsList');
      listDiv.innerHTML = '';
      channels.forEach(channel => {
        const div = document.createElement('div');
        div.className = 'channel-item' + (channel.url === activeUrl ? ' active' : '');
        div.textContent = channel.name + (channel.isDistinct ? ' (Private)' : '');
        div.onclick = () => switchChannel(channel);
        listDiv.appendChild(div);
      });
    }

    function refreshChannelsList(selectUrl) {
      const query = sb.GroupChannel.createMyGroupChannelListQuery();
      query.limit = 30;
      query.includeEmpty = true;
      query.next(function(channels, error) {
        if (!error) {
          renderChannelsList(channels, selectUrl);
          if (channels.length > 0) {
            // If switching, switch to the selected one, else first one
            let toSelect = channels[0];
            if (selectUrl) {
              const found = channels.find(c => c.url === selectUrl);
              if (found) toSelect = found;
            }
            switchChannel(toSelect);
          } else {
            document.getElementById('currentChannelName').textContent = "(No Channels)";
            clearMessages();
          }
        }
      });
    }

    function startChat() {
      document.getElementById('userIdDisplay').innerHTML = `<b>Welcome, ${USER_NAME}</b><br>User ID: ${USER_ID}`;
      sb = new SendBird({ appId: APP_ID });

      sb.connect(USER_ID, function(user, error) {
        if (error) {
          alert('Connection failed: ' + error.message);
          console.error(error);
          return;
        }
        sb.updateCurrentUserInfo(USER_NAME, null, function(){});
        refreshChannelsList();

        // Create public channel
        document.getElementById('createChannelForm').onsubmit = function(e) {
          e.preventDefault();
          const name = document.getElementById('createChannelInput').value.trim();
          if (!name) return;
          sb.GroupChannel.createChannel({
            name: name,
            isDistinct: false,
            userIds: [USER_ID],
            coverUrl: '',
            customType: 'public'
          }, function(channel, error) {
            if (error) {
              alert('Failed to create channel: ' + error.message);
              return;
            }
            document.getElementById('createChannelInput').value = '';
            refreshChannelsList(channel.url);
          });
        };

        // Create private chat
        document.getElementById('privateChatForm').onsubmit = function(e) {
          e.preventDefault();
          const otherUser = document.getElementById('privateUserInput').value.trim();
          if (!otherUser || otherUser === USER_ID) return;
          sb.GroupChannel.createChannelWithUserIds([USER_ID, otherUser], true, 'Private Chat with ' + otherUser, '', '', function(channel, error) {
            if (error) {
              alert('Failed to create private chat: ' + error.message);
              return;
            }
            document.getElementById('privateUserInput').value = '';
            refreshChannelsList(channel.url);
          });
        };

        // Send message
        document.getElementById('sendBtn').onclick = function() {
          const input = document.getElementById('messageInput');
          const msg = input.value.trim();
          if (!msg || !currentChannel) return;
          currentChannel.sendUserMessage(msg, function(message, error) {
            if (error) {
              alert('Send failed: ' + error.message);
              console.error(error);
            } else {
              renderMessage(message);
              const messagesDiv = document.getElementById('messages');
              messagesDiv.scrollTop = messagesDiv.scrollHeight;
              input.value = '';
            }
          });
        };
        // Send on Enter key
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
          if (e.key === 'Enter') document.getElementById('sendBtn').click();
        });
      });
    }
  </script>
</body>
</html>
