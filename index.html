<!DOCTYPE html>
<html>
<head>
  <title>Sendbird Chat Fix</title>
  <!-- CRITICAL: Load Sendbird FIRST -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sendbird/3.1.13/SendBird.min.js"></script>
  <style>
    #messages {
      border: 1px solid #ccc;
      height: 300px;
      overflow: auto;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div id="messages"></div>
  <input type="text" id="messageInput" placeholder="Type message" />
  <button id="sendBtn">Send</button>

  <script>
    // Configuration
    const APP_ID = 'AA3FE8A5-3D6A-4058-9C00-58C2508098DE'; // Verify this is correct
    const USER_ID = 'user_' + Math.floor(Math.random() * 1000);
    const TEST_USER = 'test_user_123'; // Must exist in your Sendbird dashboard

    // Initialize Sendbird
    const sb = new SendBird({ appId: APP_ID }); // Case-sensitive "SendBird"

    sb.connect(USER_ID, (user, error) => {
      if (error) {
        console.error('Connection failed:', error);
        alert('Check console for errors');
        return;
      }

      // Create channel
      sb.GroupChannel.createChannelWithUserIds(
        [USER_ID, TEST_USER],
        true, // Is distinct
        'Test Channel',
        '',
        '',
        (channel, error) => {
          if (error) {
            console.error('Channel error:', error);
            alert('Channel creation failed');
            return;
          }

          // Message handling
          const messagesDiv = document.getElementById('messages');
          
          // Load previous messages
          channel.createPreviousMessageListQuery().load(20, true, (messages, error) => {
            if (!error) {
              messages.forEach(msg => {
                messagesDiv.innerHTML += `<p>${msg.sender.userId}: ${msg.message}</p>`;
              });
            }
          });

          // Send messages
          document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('messageInput');
            const msg = input.value.trim();
            if (!msg) return;

            channel.sendUserMessage(msg, (message, error) => {
              if (error) {
                console.error('Send error:', error);
              } else {
                messagesDiv.innerHTML += `<p>${message.sender.userId}: ${message.message}</p>`;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                input.value = '';
              }
            });
          };
        }
      );
    });
  </script>
</body>
</html>
