<!DOCTYPE html>
<html>
<head>
  <title>Sendbird Chat</title>
<script src="https://unpkg.com/@sendbird/chat@4.6.0/dist/sendbird.min.js"></script>


</head>
<body>
  <div id="messages" style="height:300px;overflow:auto;border:1px solid #ccc;"></div>
  <input type="text" id="messageInput" placeholder="Type message" />
  <button id="sendBtn">Send</button>

  <script>
    // CONFIGURATION
    const APP_ID = 'AA3FE8A5-3D6A-4058-9C00-58C2508098DE';
    const USER_ID = 'user_' + Math.floor(Math.random() * 1000);
    const TEST_USER = 'test_user_123'; // Create this user in your dashboard first!

    // INITIALIZATION
    const sb = new SendBird({ appId: APP_ID }); // Case-sensitive!

    sb.connect(USER_ID, (user, error) => {
      if (error) {
        console.error('Connection failed:', error);
        alert('Connection error - check console');
        return;
      }

      // CHANNEL CREATION
      sb.GroupChannel.createChannelWithUserIds(
        [USER_ID, TEST_USER],
        true, // Is distinct
        'Test Channel',
        '',
        '',
        (channel, error) => {
          if (error) {
            console.error('Channel error:', error);
            alert('Channel creation failed');
            return;
          }

          // MESSAGE HANDLING
          const messagesDiv = document.getElementById('messages');
          
          // Load previous messages
          const messageListQuery = channel.createPreviousMessageListQuery();
          messageListQuery.load(20, true, (messages, error) => {
            if (!error) {
              messages.forEach(msg => {
                messagesDiv.innerHTML += `<p><strong>${msg.sender.userId}:</strong> ${msg.message}</p>`;
              });
            }
          });

          // Send new messages
          document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('messageInput');
            const msg = input.value.trim();
            if (!msg) return;

            channel.sendUserMessage(msg, (message, error) => {
              if (error) {
                console.error('Send error:', error);
              } else {
                messagesDiv.innerHTML += `<p><strong>${message.sender.userId}:</strong> ${message.message}</p>`;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                input.value = '';
              }
            });
          };
        }
      );
    });
  </script>
</body>
</html>
